name: Tests

on:
    push:
      branches: ["main"]
    pull_request:
      branches: ["main"]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # FIXME(windows):
        # LINK : warning LNK4098: defaultlib 'LIBCMT' conflicts with use of other libs; use /NODEFAULTLIB:library
        # D:\a\anitag2vec\anitag2vec\target\debug\deps\anitag2vec-5cf1e25c33d9bde6.exe : fatal error LNK1319: 1 mismatches detected
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Run tests
        run: cargo test --all
